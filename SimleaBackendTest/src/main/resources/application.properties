spring.application.name=SimleaBackendTest

linkedin.client-id=${LINKEDIN_CLIENT_ID}
linkedin.client-secret=${LINKEDIN_CLIENT_CRED}
linkedin.redirect-uri=http://localhost:4200/auth/callback
linkedin.scope=openid profile email

server.port=8080

# H2 in-memory for development (switch to PostgreSQL for production)
spring.datasource.url=jdbc:h2:mem:simlea;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=create-drop

# PostgreSQL configuration (activate with --spring.profiles.active=postgres)
# spring.datasource.url=jdbc:postgresql://localhost:5432/simlea
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.datasource.username=postgres
# spring.datasource.password=${DB_PASSWORD}
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Caching
spring.cache.type=simple

# Search provider API keys (set via environment variables)
search.google.api-key=${GOOGLE_API_KEY:}
search.google.cx=${GOOGLE_CX:}
search.bing.api-key=${BING_API_KEY:}
